<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>meesho</h2>

    <button class="active">Profiles</button>
    <button>Defaults</button>
    <button>Auto Capture</button>
    <button>Bulk Listing</button>
  </div>

  <!-- Main -->
  <div class="main">

    <div class="header">
      <h1>MEESHO <span>AUTOFILL</span></h1>
      <button id="autofillBtn">Autofill</button>
    </div>

    <div class="card">
      <h3>Profiles</h3>

      <select id="profileList"></select>

      <div class="row">
        <button id="rename">Rename</button>
        <button id="delete">Delete</button>
      </div>

      <button id="detect">Capture Fields</button>
      <button id="auto">Auto Capture</button>

      <div class="status" id="statusBox">
        Ready to Autofill
      </div>

      <button id="stop" class="danger">STOP AUTOFILL</button>

    </div>

  </div>

</div>

<script src="popup.js"></script>
</body>
</html>
